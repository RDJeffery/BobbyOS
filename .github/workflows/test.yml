name: Test Pi GameUI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev
        sudo apt-get install -y xvfb
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Test basic imports
      run: |
        python -c "import pygame; print('Pygame version:', pygame.version.ver)"
        python -c "import json, os, subprocess, time, threading, queue; print('All imports OK')"
    
    - name: Test main launcher (headless)
      run: |
        xvfb-run -a python -c "
        import sys
        sys.path.append('.')
        from main import GameUI
        import pygame
        pygame.init()
        # Test basic initialization
        game_ui = GameUI()
        print('GameUI initialized successfully')
        pygame.quit()
        "
    
    - name: Test shell app (headless)
      run: |
        xvfb-run -a python -c "
        import sys
        sys.path.append('.')
        from apps.shell_ui import ShellUI
        import pygame
        pygame.init()
        # Test basic initialization
        shell_ui = ShellUI()
        print('ShellUI initialized successfully')
        pygame.quit()
        "
    
    - name: Test config loading
      run: |
        python -c "
        import json
        with open('config.json', 'r') as f:
            config = json.load(f)
        print('Config loaded successfully:', len(config), 'items')
        for item in config:
            assert 'label' in item
            assert 'command' in item
        print('Config validation passed')
        "
